[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaomoji-reply"
version = "0.1.0"
description = "Chinese scenario replies with context-aware kaomoji decoration"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["kaomoji", "chinese", "reply", "emoji"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Text Processing"]
dependencies = []

[project.optional-dependencies]
slang = ["jieba==0.42.1"]

[project.scripts]
kaomoji-reply = "kaomoji_reply.__main__:main"

[tool.setuptools.packages.find]
include = ["kaomoji_reply*"]

[tool.setuptools.package-data]
kaomoji_reply = ["data/*.json", "data/*.txt"]
